# @package _global_
# Formal Model B: B73 Phase-I -> all-cultivar schema-v3 16K continuation.
defaults:
  - /trainer: default
  - /loader: default
  - /dataset: onemaize_allcultivar_phase2_16k_region_aware
  - /task: lm
  - /optimizer: adamw
  - /scheduler: cosine_warmup_timm
  - /callbacks: [base, checkpoint]
  - /model: caduceus

model:
  _name_: caduceus_lm
  config:
    d_model: 864
    n_layer: 24
    vocab_size: 12
    pad_token_id: 4
    bidirectional: true
    bidirectional_strategy: add
    bidirectional_weight_tie: true
    rcps: false
    use_memory: true
    memory_d_sum: 64
    memory_d_mem: 64
    memory_n_heads: 4
    memory_write_stride: 6
    memory_read_stride: 2
    memory_max_size: 32
    memory_persist_across_batches: false

encoder: null
decoder: null

task:
  _name_: lm
  loss:
    _name_: cross_entropy
    ignore_index: 4
  metrics: null
  torchmetrics: [perplexity, num_tokens]

train:
  seed: 2222
  monitor: val/loss
  mode: min
  test: false
  ckpt: null
  # Strict model-only initialization; optimizer/scheduler start fresh.
  pretrained_model_path: ???
  pretrained_model_strict_load: true
  pretrained_model_state_hook:
    _name_: null

trainer:
  accelerator: gpu
  devices: 1
  num_nodes: 1
  precision: bf16
  max_epochs: null
  max_steps: ???
  accumulate_grad_batches: 8
  gradient_clip_val: 0.5
  num_sanity_val_steps: 0
  log_every_n_steps: 20
  limit_train_batches: 1.0
  limit_val_batches: 1.0

loader:
  num_workers: 4
  pin_memory: true
  drop_last: false

optimizer:
  lr: 4e-5
  weight_decay: 0.01
  betas: [0.9, 0.98]

scheduler:
  t_in_epochs: false
  t_initial: ${trainer.max_steps}
  warmup_t: ???
  lr_min: 1e-5
  warmup_lr_init: 1e-6

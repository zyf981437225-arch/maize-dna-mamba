# @package _global_
defaults:
  - /trainer: default
  - /loader: default
  - /dataset: human_m6a_nucleotide
  - /task: m6a_site
  - /optimizer: adamw
  - /scheduler: plateau
  - /callbacks: [base, checkpoint]
  - /model: caduceus

model:
  _name_: dna_embedding_caduceus
  config:
    d_model: 768
    n_layer: 12
    vocab_size: 12
    pad_token_id: 4
    rcps: false

encoder: id
decoder:
  _name_: sequence
  mode: first
  use_lengths: false

train:
  seed: 2357
  monitor: val/m6a_average_precision
  mode: max
  test: true
  ckpt: null
  pretrained_model_path: null
  pretrained_model_strict_load: false
  pretrained_model_state_hook:
    _name_: load_matching_backbone
    freeze_backbone: false

trainer:
  accelerator: gpu
  devices: 1
  max_epochs: 10
  precision: 16
  accumulate_grad_batches: 4
  gradient_clip_val: 1.0
  num_sanity_val_steps: 0
  log_every_n_steps: 10

loader:
  num_workers: 0
  pin_memory: true
  drop_last: false

optimizer:
  lr: 2e-5
  weight_decay: 0.01

scheduler:
  patience: 2

callbacks:
  periodic_checkpoint:
    every_n_epochs: 2

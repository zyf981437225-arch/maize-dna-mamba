# @package _global_
# Short A100 integration run through dynamic regions, MLM, BCW, and memory.
defaults:
  - /trainer: default
  - /loader: default
  - /dataset: onemaize_dna_mlm
  - /task: lm
  - /optimizer: adamw
  - /scheduler: cosine_warmup_timm
  - /callbacks: [base]
  - /model: caduceus

model:
  _name_: caduceus_lm
  config:
    d_model: 128
    n_layer: 4
    vocab_size: 12
    pad_token_id: 4
    bidirectional: true
    bidirectional_strategy: add
    bidirectional_weight_tie: true
    rcps: false
    use_memory: true
    memory_d_sum: 32
    memory_d_mem: 32
    memory_write_stride: 2
    memory_read_stride: 1
    memory_persist_across_batches: false

encoder: null
decoder: null

dataset:
  context_length: 8192
  train_samples_per_epoch: 32
  val_samples_per_epoch: 8
  test_samples_per_epoch: 8

task:
  _name_: lm
  loss:
    _name_: cross_entropy
    ignore_index: 4
  metrics: null
  torchmetrics: []

train:
  seed: 2222
  monitor: val/loss
  mode: min
  test: false
  ckpt: null
  pretrained_model_path: null
  pretrained_model_strict_load: true
  pretrained_model_state_hook:
    _name_: null

trainer:
  accelerator: gpu
  devices: 1
  num_nodes: 1
  precision: bf16
  max_epochs: null
  max_steps: 2
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
  num_sanity_val_steps: 0
  log_every_n_steps: 1
  limit_train_batches: 2
  limit_val_batches: 1

loader:
  num_workers: 0
  pin_memory: true
  drop_last: false

optimizer:
  lr: 8e-5
  weight_decay: 0.01
  betas: [0.9, 0.98]

scheduler:
  t_in_epochs: false
  t_initial: ${trainer.max_steps}
  warmup_t: 1
  lr_min: 2e-5
  warmup_lr_init: 1e-6

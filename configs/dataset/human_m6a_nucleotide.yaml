_name_: human_m6a_nt

# Directory created by scripts/prepare_m6a_nucleotide.py.
data_dir: ${oc.env:M6A_NT_DATA_DIR,data/processed/human_m6a_nucleotide}
tokenizer_name: char

# Windows overlap to provide boundary context. Midpoint ownership ensures that
# each A contributes to the loss exactly once per epoch.
window_length: 1024
stride: 512
require_mrna_coordinate_reliable: true

batch_size: 8
batch_size_eval: 16
shuffle: true

# Deterministic smoke-test limits; null uses the complete split.
max_train_transcripts: null
max_val_transcripts: null
max_test_transcripts: null
max_train_windows: null
max_val_windows: null
max_test_windows: null

_name_: human_m6a_full

# Directory created by scripts/prepare_m6a_nucleotide.py (schema version 2).
data_dir: ${oc.env:M6A_NT_DATA_DIR,data/processed/human_m6a_nucleotide}
tokenizer_name: char

# One item is one complete 5'UTR + CDS + 3'UTR transcript. Transcripts above
# this limit are reported and excluded, never silently truncated.
max_sequence_length: 10240
overlength_policy: exclude
require_mrna_coordinate_reliable: true
require_cds_boundary_reliable: true

# Dynamic right padding is applied only to the longest item in each batch.
# BiMamba reverses valid prefixes rather than moving PAD before the sequence.
pad_to_multiple: 8
batch_size: 1
batch_size_eval: 1
shuffle: true

# Deterministic smoke/benchmark limits; null uses the complete split.
max_train_transcripts: null
max_val_transcripts: null
max_test_transcripts: null

_name_: full_transcript_rna_mlm

# Prepared by scripts/prepare_pretraining_5m.py. Sequence bytes are memory
# mapped lazily instead of copied into every DDP worker/process.
data_dir: ${oc.env:RNA_PRETRAIN_INDEXED_DIR,data/processed/rna_pretraining_5m}
indexed_data_dir: ${oc.env:RNA_PRETRAIN_INDEXED_DIR,data/processed/rna_pretraining_5m}

ncrna_fasta: null
include_ncrna: false
split_seed: 2357

tokenizer_name: char
max_sequence_length: 10240
require_mrna_coordinate_reliable: false
require_cds_boundary_reliable: false

mlm: true
mlm_probability: 0.15
pad_to_multiple: 8
batch_size: 1
batch_size_eval: 1
shuffle: true

max_train_sequences: null
max_val_sequences: null
max_test_sequences: null
